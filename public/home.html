<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Minhas cidades | Atmosfera</title>
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/home.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <div class="stars-far"></div>
      <div class="stars"></div>
      <div class="moon"></div>
      <div class="clouds">
        <span class="cloud"></span><span class="cloud dense"></span><span class="cloud"></span>
        <span class="cloud dense"></span><span class="cloud"></span><span class="cloud dense"></span>
      </div>
    </div>

    <header class="topbar">
      <div class="brand-line">
        <span class="logo">⛅ Atmosfera</span>
      </div>
      <div class="account">
        <span class="account-name" id="account-name"></span>
        <button class="btn ghost small" id="change-password-btn" type="button">Trocar senha</button>
        <button class="btn danger small" id="logout-btn" type="button">Sair</button>
      </div>
    </header>

    <main class="page">
      <section class="search card" aria-labelledby="search-title">
        <h2 id="search-title">Adicionar cidade</h2>
        <div class="search-box">
          <input id="search-input" type="search" placeholder="Pesquise uma cidade pelo nome" autocomplete="off" aria-controls="search-results" />
        </div>
        <ul class="results hidden" id="search-results"></ul>
        <p class="msg" id="search-msg" role="status"></p>
      </section>

      <section aria-labelledby="cities-title">
        <h2 class="section-title" id="cities-title">Minhas cidades</h2>
        <p class="msg error" id="error" role="alert"></p>
        <div class="grid" id="city-list" aria-live="polite">
          <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        </div>
      </section>
    </main>

    <dialog id="password-dialog" class="card dialog">
      <form id="password-form" novalidate>
        <h2>Trocar senha</h2>
        <div class="field">
          <label for="senha-atual">Senha atual</label>
          <input id="senha-atual" type="password" autocomplete="current-password" required />
        </div>
        <div class="field">
          <label for="nova-senha">Nova senha</label>
          <input id="nova-senha" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" required />
        </div>
        <div class="field">
          <label for="confirmar-senha">Confirmar nova senha</label>
          <input id="confirmar-senha" type="password" autocomplete="new-password" required />
        </div>
        <p class="msg" id="password-msg" role="alert"></p>
        <div class="dialog-actions">
          <button type="button" class="btn ghost" id="password-cancel">Cancelar</button>
          <button type="submit" class="btn" id="password-submit">Salvar</button>
        </div>
      </form>
    </dialog>

    <script src="/api.js"></script>
    <script src="/home.js"></script>
  </body>
</html>
